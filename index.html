<!DOCTYPE html>
<html lang="ko">
<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;

    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
  }
  header {
    text-align: center;
    padding: 0.8rem 1rem 0.4rem;

  }

    color: #f8fafc;
    margin-bottom: 0.15rem;
  }

  .audio-bar {
    display: flex;

    align-items: center;
    justify-content: center;
    padding: 0.3rem 0.8rem;
    flex-wrap: wrap;
  }
  .audio-toggle {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0.8rem;
    border: 1px solid #334155;
    border-radius: 999px;
    background: #1e293b;
    color: #cbd5e1;
    font-size: 0.78rem;
    cursor: pointer;

  }
  .audio-toggle.on { background: #10b981; border-color: #10b981; color: #fff; }

  .audio-replay {
    padding: 0.35rem 0.7rem;

    border-radius: 999px;
    background: #1e293b;
    color: #cbd5e1;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .audio-replay:hover { background: #334155; }
  .audio-replay:disabled { opacity: 0.3; cursor: not-allowed; }
  .audio-status {
    font-size: 0.7rem;
    color: #64748b;
    min-width: 50px;
    text-align: center;
  }

  .controls {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0.4rem 0.8rem 0.5rem;

    background: #1e293b;
    color: #cbd5e1;

    border-radius: 2px;

  .progress-bar .fill {

    border-radius: 2px;

    min-height: 400px;

    width: 100%;
    transform-style: preserve-3d;

  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {

    backface-visibility: hidden;

    display: flex;
    flex-direction: column;
    min-height: 400px;

    left: 0;

  .tag.type-writing { background: #f59e0b33; color: #fcd34d; }
  .tag.type-oral { background: #8b5cf633; color: #c4b5fd; }
  .tag.type-mock { background: #ef444433; color: #fca5a5; }

    font-size: 1.13rem;
    line-height: 1.6;
    color: #f1f5f9;
    margin-bottom: 1rem;
    flex-grow: 1;
  }
  .answer-label {
    font-size: 0.78rem;
    color: #94a3b8;
    margin-bottom: 0.5rem;
    font-weight: 600;
  }
  .answer {
    font-size: 0.93rem;
    line-height: 1.7;
    color: #e2e8f0;
    flex-grow: 1;
    white-space: pre-wrap;

    color: #64748b;
    font-size: 0.68rem;
    margin-top: 1rem;
    padding-top: 0.7rem;

    justify-content: space-between;
    width: 100%;
    max-width: 500px;
    padding: 0 1rem 0.6rem;
    gap: 0.5rem;
  }
  .nav button {
    flex: 1;
    padding: 0.65rem;
    border: 1px solid #334155;
    border-radius: 0.55rem;
    background: #1e293b;
    color: #cbd5e1;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav button:hover, .nav button:active { background: #334155; }
  .nav button:disabled { opacity: 0.4; cursor: not-allowed; }

  .keyboard-hint {
    font-size: 0.68rem;
    color: #475569;
    text-align: center;
    padding: 0.3rem;
  }
  .keyboard-hint kbd {
    background: #1e293b;
    padding: 0.1rem 0.4rem;
    border-radius: 0.2rem;
    border: 1px solid #334155;
    font-family: inherit;
  }

  .stats {
    text-align: center;
    color: #64748b;
    font-size: 0.68rem;
    padding: 0.3rem;
  }

  @media (min-width: 768px) {
    .card h2 { font-size: 1.3rem; }
    .answer { font-size: 1rem; }
  }
</style>
</head>

<script>
const DATA = [{"no": 1, "ch": "토픽스쿨", "cat": "한국생활", "label": "1과. 한국생활 적응", "type": "구술", "num": 1, "q": "한국에 처음 왔을 때 어땠어요?", "a": "저는 5년 전에 베트남 하노이에서 한국에 처음 왔습니다. 처음에는 한국어를 잘 못해서 의사소통이 안 되느라고 정말 힘들었습니다. 한국 음식이 맵고 짜서 적응하느라고 고생했습니다. 또 가족들이 보고 싶어서 매일 영상통화를 했습니다. 날씨도 베트남과 달라서 겨울에는 너무 추워서 적응하기가 어려웠습니다."}, {"no": 2, "ch": "토픽스쿨", "cat": "한국생활", "label": "1과. 한국생활 적응", "type": "구술", "num": 2, "q": "한국에 살아 보니까 어때요?", "a": "한국에서 5년 동안 살아 보니까 이제 많이 편해졌습니다. 한국어를 공부할수록 한국 친구들과 대화하기가 쉬워집니다. 한국 음식을 먹을수록 매운 맛에도 익숙해지는 것 같습니다. 한국은 지하철과 버스가 편리해서 어디든지 갈 수 있습니다. 안전하고 인터넷도 빨라서 살기 좋은 나라인 것 같습니다."}, {"no": 3, "ch": "토픽스쿨", "cat": "한국생활", "label": "1과. 한국생활 적응", "type": "구술", "num": 3, "q": "한국 생활 적응 초기와 현재 생활에 대해 이야기해 보세요.", "a": "처음 한국에 왔을 때는 한국어를 잘 못해서 의사소통이 힘들었습니다. 그래서 어학당에 다니면서 한국어를 열심히 공부했고, 한국 친구도 많이 사귀었습니다. 지금은 대학원에서 경영학 석사 과정을 공부하고 있고, 학교 생활도 즐겁습니다. 한국 생활이 익숙해질수록 한국이 제2의 고향처럼 느껴집니다."}, {"no": 4, "ch": "토픽스쿨", "cat": "한국생활", "label": "1과. 한국생활 적응", "type": "작문", "num": 1, "q": "'나의 한국 생활 적응'이라는 제목으로 100자 내외로 글을 쓰세요. (어려운 점, 적응 방법)", "a": "처음 한국에 왔을 때 언어와 문화 차이로 많이 힘들었습니다. 한국어를 배우느라고 매일 늦게까지 공부했고, 한국 친구들과 자주 만나면서 한국 문화를 배웠습니다. 지금은 경영학 석사 과정을 공부할 정도로 한국 생활에 잘 적응했고, 한국이 제2의 고향처럼 편안합니다."}, {"no": 5, "ch": "토픽스쿨", "cat": "가족", "label": "2과. 가족의 변화", "type": "구술", "num": 1, "q": "여러분 고향에서는 가족과 관련하여 어떤 정책을 실시하고 있습니까?", "a": "베트남에서는 예전에 산아제한 정책이 있어서 두 자녀 정책을 실시했었습니다. 그래서 한 가정에서 두 명의 자녀만 낳을 수 있었습니다. 하지만 요즘은 출산율이 낮아져서 정책이 많이 완화되었습니다. 한국처럼 베트남도 핵가족이 많아지고 있고, 결혼하지 않는 젊은이들도 늘어나고 있습니다."}, {"no": 6, "ch": "토픽스쿨", "cat": "가족", "label": "2과. 가족의 변화", "type": "작문", "num": 1, "q": "'가족의 변화'라는 제목으로 100자 내외로 글을 쓰세요. (대가족 vs 핵가족)", "a": "저는 핵가족이 더 좋다고 생각합니다. 핵가족은 가족 구성원이 적어서 의사결정이 빠르고 자유롭게 생활할 수 있기 때문입니다. 하지만 대가족은 어른들에게서 많이 배울 수 있고 가족 간의 정이 깊다는 장점이 있습니다. 베트남도 한국처럼 점점 핵가족이 늘어나고 있습니다."}, {"no": 7, "ch": "토픽스쿨", "cat": "과학기술", "label": "3과. 생활 속의 과학", "type": "구술", "num": 1, "q": "여러분은 스트레스를 받을 때 어떻게 해요?", "a": "저는 스트레스를 받을 때 한국 드라마를 보곤 합니다. 드라마를 보면서 웃으면 기분이 좋아집니다. 가끔은 친구들과 카페에서 베트남 음식을 먹으면서 수다를 떨곤 합니다. 또 학교 도서관에서 음악을 들으면서 공부에 집중하면 스트레스가 풀립니다."}, {"no": 8, "ch": "토픽스쿨", "cat": "과학기술", "label": "3과. 생활 속의 과학", "type": "구술", "num": 2, "q": "최신 제품의 장점에 대해 이야기해 보세요.", "a": "휴대폰 번역기 앱은 정말 편리합니다. 한국어를 모르는 단어가 있을 때 바로 베트남어로 번역할 수 있습니다. 인공지능 스피커는 노래도 틀어주고 날씨도 알려주니까 심심하지 않습니다. 또 무선 청소기는 가벼워서 청소하기가 편합니다. 과학기술이 발전할수록 우리 생활이 편리해지는 것 같습니다."}, {"no": 9, "ch": "토픽스쿨", "cat": "과학기술", "label": "3과. 생활 속의 과학", "type": "구술", "num": 3, "q": "여러분 나라에서는 난방 또는 냉방을 어떻게 합니까?", "a": "베트남은 더운 나라라서 냉방이 주로 필요합니다. 하노이는 겨울에 좀 추워서 따뜻한 옷을 입지만 난방은 거의 사용하지 않습니다. 여름에는 에어컨과 선풍기를 많이 사용합니다. 한국처럼 바닥 난방은 없고, 보통 에어컨으로 냉방과 난방을 모두 합니다."}, {"no": 10, "ch": "토픽스쿨", "cat": "과학기술", "label": "3과. 생활 속의 과학", "type": "작문", "num": 1, "q": "'과학기술의 발전'이라는 제목으로 100자 내외로 글을 쓰세요.", "a": "과학기술이 발전하면서 우리 생활이 정말 편리해졌습니다. 휴대폰 하나로 쇼핑, 결제, 공부까지 모두 가능합니다. 특히 번역 앱 덕분에 외국에서 유학 생활하기가 훨씬 쉬워졌습니다. 저도 한국에서 공부하면서 다양한 기술의 도움을 받고 있어 감사합니다."}, {"no": 11, "ch": "토픽스쿨", "cat": "의례", "label": "4과. 한국의 의례", "type": "구술", "num": 1, "q": "여러분 고향에서는 성년이 된 것을 어떻게 기념합니까?", "a": "베트남에서는 18살이 되면 신분증이 나오고 성인으로 인정받습니다. 특별한 성년식은 하지 않지만 가족들과 식사를 하면서 축하합니다. 18살부터 운전면허를 딸 수 있고, 결혼도 할 수 있습니다. 한국처럼 성년의 날이 따로 없지만 친구들과 함께 모여서 파티를 하기도 합니다."}, {"no": 12, "ch": "토픽스쿨", "cat": "의례", "label": "4과. 한국의 의례", "type": "작문", "num": 1, "q": "'특별한 날'이라는 제목으로 100자 내외로 글을 쓰세요.", "a": "베트남에서 가장 특별한 날은 설날인 '뗏(Tết)'입니다. 가족이 모두 모여서 전통 음식을 먹고 조상님께 제사를 지냅니다. 한국의 설날과 비슷하지만 베트남은 따뜻해서 분위기가 다릅니다. 한국에 온 후로는 가족이 그리워서 베트남 친구들과 함께 뗏을 보냅니다."}, {"no": 13, "ch": "토픽스쿨", "cat": "문화유산", "label": "5과. 문화유산", "type": "구술", "num": 1, "q": "한국에서 가보고 싶은 곳에 대해 이야기해 보세요.", "a": "저는 경복궁과 창덕궁에 가본 적이 있는데, 한복을 입고 사진을 찍었습니다. 다음에는 제주도에 가서 성산일출봉과 한라산 백록담을 보고 싶습니다. 또 경주에 가서 불국사와 석굴암 같은 신라 시대의 문화유산도 보고 싶습니다. 한국의 자연과 역사를 모두 경험하고 싶습니다."}, {"no": 14, "ch": "토픽스쿨", "cat": "문화유산", "label": "5과. 문화유산", "type": "구술", "num": 2, "q": "여러분 고향의 전통 문화는 무엇이 있습니까?", "a": "베트남의 대표적인 전통 의상은 아오자이(Áo dài)입니다. 결혼식이나 특별한 날에 입습니다. 또 수상 인형극도 베트남의 유명한 전통 예술입니다. 베트남 전통 음식으로는 쌀국수와 분짜가 있는데 한국에서도 인기가 많습니다."}, {"no": 15, "ch": "토픽스쿨", "cat": "문화유산", "label": "5과. 문화유산", "type": "작문", "num": 1, "q": "'문화유산'이라는 제목으로 100자 내외로 글을 쓰세요.", "a": "한국에는 경복궁, 불국사, 종묘 같은 훌륭한 문화유산이 많습니다. 베트남에는 하롱베이가 유네스코 세계유산으로 지정되어 있습니다. 문화유산은 그 나라의 역사와 문화를 보여주기 때문에 잘 보존해야 합니다. 저도 한국에서 공부하면서 한국의 문화유산에 관심을 가지게 되었습니다."}, {"no": 16, "ch": "토픽스쿨", "cat": "세계화", "label": "6과. 세계화 시대", "type": "구술", "num": 1, "q": "국제화 시대에 필요한 인재상은 무엇입니까?", "a": "국제화 시대에는 외국어 능력이 가장 중요합니다. 또한 다른 문화를 이해하고 존중할 줄 알아야 합니다. 저는 베트남어, 한국어, 영어를 할 수 있고, 경영학을 공부하면서 글로벌 비즈니스 감각을 키우고 있습니다. 또 다양한 나라 친구들과 교류하면서 다문화 이해 능력을 기르고 있습니다."}, {"no": 17, "ch": "토픽스쿨", "cat": "세계화", "label": "6과. 세계화 시대", "type": "작문", "num": 1, "q": "'국제화 시대의 인재상'이라는 제목으로 100자 내외로 글을 쓰세요.", "a": "국제화 시대의 인재는 외국어 능력과 다문화 이해 능력이 필요합니다. 저는 한국에서 경영학 석사 과정을 공부하면서 한국 기업 문화를 배우고 있습니다. 베트남과 한국을 연결하는 글로벌 비즈니스 전문가가 되기 위해 한국어와 영어 공부를 꾸준히 하고 있습니다."}, {"no": 18, "ch": "토픽스쿨", "cat": "건강", "label": "7과. 현대인의 질병", "type": "구술", "num": 1, "q": "여러분은 몸이 아팠던 적이 있어요?", "a": "작년에 감기에 심하게 걸려서 일주일 동안 학교를 못 갔습니다. 열도 나고 기침도 심해서 병원에 가서 약을 처방받았습니다. 한국 건강보험에 가입되어 있어서 병원비가 비싸지 않아 다행이었습니다. 그 후로는 운동도 하고 비타민도 먹으면서 건강 관리를 더 신경 쓰고 있습니다."}, {"no": 19, "ch": "토픽스쿨", "cat": "건강", "label": "7과. 현대인의 질병", "type": "구술", "num": 2, "q": "현대인의 잘못된 생활습관으로 인해 걸리는 병에는 어떤 것이 있나요?", "a": "현대인들은 운동 부족과 잘못된 식습관 때문에 고혈압, 당뇨병, 비만 같은 병에 많이 걸립니다. 또 스트레스를 많이 받아서 우울증이나 불면증에 걸리는 사람도 많습니다. 저도 시험 기간에 스트레스를 많이 받아서 위염에 걸린 적이 있습니다. 그래서 규칙적인 식사와 충분한 수면이 중요한 것 같습니다."}, {"no": 20, "ch": "토픽스쿨", "cat": "건강", "label": "7과. 현대인의 질병", "type": "작문", "num": 1, "q": "'생활습관 병'이라는 제목으로 100자 내외로 글을 쓰세요.", "a": "현대인들은 잘못된 생활습관 때문에 고혈압, 당뇨병, 비만 같은 병에 많이 걸립니다. 이런 병을 예방하려면 규칙적인 식사와 운동이 중요합니다. 또 충분히 자고 스트레스를 줄여야 합니다. 저도 석사 공부 때문에 바쁘지만 일주일에 세 번은 운동하려고 노력하고 있습니다."}, {"no": 21, "ch": "토픽스쿨", "cat": "정보화", "label": "8과. 정보화 사회", "type": "구술", "num": 1, "q": "인터넷이나 SNS로 들은 친구의 소식에 대해 이야기해 보세요.", "a": "지난주에 인터넷으로 베트남에 있는 고등학교 친구가 결혼한다는 소식을 들었습니다. SNS에 사진을 올렸길래 봤는데 정말 행복해 보였습니다. 한국에 살고 있어서 직접 가지 못했지만 영상통화로 축하해 주었습니다. SNS 덕분에 멀리 있는 친구들의 소식을 쉽게 들을 수 있어서 좋습니다."}, {"no": 22, "ch": "토픽스쿨", "cat": "정보화", "label": "8과. 정보화 사회", "type": "작문", "num": 1, "q": "'스마트폰 중독'이라는 제목으로 100자 내외로 글을 쓰세요.", "a": "요즘 사람들은 스마트폰을 너무 많이 사용해서 문제가 됩니다. 특히 자기 전에 스마트폰을 보면 잠을 잘 못 자고 다음 날 피곤해집니다. 또 스마트폰 때문에 가족이나 친구와의 대화 시간도 줄어듭니다. 스마트폰 사용 시간을 정해 놓고 사용하는 것이 좋다고 생각합니다."}, {"no": 23, "ch": "토픽스쿨", "cat": "사건사고", "label": "9과. 사건과 사고", "type": "구술", "num": 1, "q": "지금까지 살면서 큰일 날 뻔한 적에 대해 이야기해 보세요.", "a": "작년 겨울에 길에서 빙판길에 미끄러져서 다칠 뻔했습니다. 다행히 친구가 잡아 주어서 안 다쳤습니다. 또 한국에 처음 왔을 때 베트남과 운전 방향이 반대여서 길을 건너다가 사고 날 뻔한 적도 있습니다. 그 후로는 항상 양쪽을 잘 보고 길을 건넙니다."}, {"no": 24, "ch": "토픽스쿨", "cat": "사건사고", "label": "9과. 사건과 사고", "type": "구술", "num": 2, "q": "비만이 생기는 원인에 대해 이야기해 보세요.", "a": "비만은 운동 부족과 잘못된 식습관 때문에 생깁니다. 패스트푸드를 많이 먹거나 단 음식을 자주 먹으면 살이 찌기 쉽습니다. 또 스트레스를 받아서 폭식하는 것도 원인입니다. 저도 시험 기간에 스트레스를 받아서 야식을 많이 먹은 적이 있는데 살이 많이 쪘습니다."}, {"no": 25, "ch": "토픽스쿨", "cat": "사건사고", "label": "9과. 사건과 사고", "type": "작문", "num": 1, "q": "'사건과 사고'라는 제목으로 100자 내외로 글을 쓰세요. (직접 경험한 사건이나 사고)", "a": "한국에 처음 왔을 때 지하철을 잘못 타서 길을 잃은 적이 있습니다. 한국어도 잘 못해서 정말 무서웠습니다. 그때 친절한 한국 분이 도와주셔서 무사히 집에 갈 수 있었습니다. 그 일을 통해 한국인들의 친절함을 느꼈고, 한국어를 더 열심히 공부해야겠다고 생각했습니다."}, {"no": 26, "ch": "토픽스쿨", "cat": "언어", "label": "10과. 언어생활", "type": "구술", "num": 1, "q": "여러분은 한국어로 말할 때 어떤 어려움이 있어요?", "a": "한국어는 발음이 베트남어와 많이 달라서 어렵습니다. 특히 'ㅓ'와 'ㅗ', 'ㅡ'와 'ㅜ' 발음을 구별하기가 힘듭니다. 또 존댓말과 반말 구분도 처음에는 헷갈렸습니다. 그리고 한자어가 많아서 어휘를 외우는 것도 어려웠습니다. 그래도 매일 연습하니까 많이 늘었습니다."}, {"no": 27, "ch": "토픽스쿨", "cat": "언어", "label": "10과. 언어생활", "type": "구술", "num": 2, "q": "여러분이 의도하지 않았는데 일어난 일이 있어요? 이야기해 보세요.", "a": "한국 친구에게 농담으로 한 말이 친구가 오해해서 기분 나빠한 적이 있습니다. 베트남 표현을 그대로 번역해서 사용했더니 한국에서는 이상하게 들렸나 봅니다. 의도와 다르게 친구가 화가 나서 미안했습니다. 그 후로는 표현을 더 조심해서 사용합니다."}, {"no": 28, "ch": "토픽스쿨", "cat": "언어", "label": "10과. 언어생활", "type": "구술", "num": 3, "q": "여러분 고향에는 말과 관련된 어떤 속담이 있습니까?", "a": "베트남에는 '한 마디의 칭찬이 백 가지 보석보다 낫다'는 속담이 있습니다. 말이 얼마나 중요한지 알려주는 속담입니다. 한국 속담 '말 한마디로 천 냥 빚을 갚는다'와 비슷합니다. 또 '말은 마음의 거울이다'라는 속담도 있습니다. 베트남에서도 한국처럼 말을 조심해서 하는 것을 중요하게 생각합니다."}, {"no": 29, "ch": "토픽스쿨", "cat": "언어", "label": "10과. 언어생활", "type": "작문", "num": 1, "q": "'나의 한국어'라는 제목으로 100자 내외로 글을 쓰세요.", "a": "한국어를 5년 동안 배우면서 많이 늘었습니다. 처음에는 인사말도 잘 못했지만 지금은 대학원 수업을 듣고 발표도 할 수 있습니다. 한국어를 공부할수록 한국 문화를 더 깊이 이해하게 되어 좋습니다. 앞으로 토픽 6급 시험에 합격하고 한국 회사에 취직하고 싶습니다."}, {"no": 30, "ch": "토픽스쿨", "cat": "교육", "label": "11과. 교육 제도", "type": "구술", "num": 1, "q": "여러분의 교육에 대한 생각을 이야기해 보세요.", "a": "저는 교육이 사람의 미래를 결정한다고 생각합니다. 그래서 한국에서 석사까지 공부하고 있습니다. 좋은 교육을 받을수록 더 많은 기회가 생기는 것 같습니다. 베트남에서도 교육열이 점점 높아지고 있고, 외국 유학을 가는 학생도 많아지고 있습니다. 평생 배우는 자세가 중요한 것 같습니다."}, {"no": 31, "ch": "토픽스쿨", "cat": "교육", "label": "11과. 교육 제도", "type": "구술", "num": 2, "q": "여러분은 돈이 없었을 때 어땠어요?", "a": "한국에 처음 왔을 때 학비와 생활비가 부족해서 정말 힘들었습니다. 그래서 카페에서 아르바이트를 하면서 학교를 다녔습니다. 부모님께 부담을 드리지 않으려고 절약하면서 살았습니다. 라면만 먹은 적도 있고, 친구 집에서 같이 잠을 잔 적도 있습니다. 지금은 장학금을 받아서 좀 나아졌습니다."}, {"no": 32, "ch": "토픽스쿨", "cat": "교육", "label": "11과. 교육 제도", "type": "구술", "num": 3, "q": "여러분은 몸이 많이 아팠을 때 어땠어요?", "a": "작년에 위염에 걸려서 한 달 동안 고생했습니다. 시험 기간이라 스트레스를 많이 받아서 그랬던 것 같습니다. 한국 친구들이 죽을 사다 주고 병원도 같이 가 주어서 정말 고마웠습니다. 가족들이 옆에 없어서 외로웠지만 친구들 덕분에 잘 이겨낼 수 있었습니다."}, {"no": 33, "ch": "토픽스쿨", "cat": "교육", "label": "11과. 교육 제도", "type": "작문", "num": 1, "q": "'교육제도'라는 제목으로 100자 내외로 글을 쓰세요. (여러분 고향의 학제)", "a": "베트남의 학제는 초등학교 5년, 중학교 4년, 고등학교 3년으로 총 12년입니다. 한국과 비슷하지만 중학교가 1년 더 깁니다. 베트남에서도 대학 입시가 매우 중요해서 학생들이 열심히 공부합니다. 요즘은 한국이나 외국으로 유학 가는 학생도 많아지고 있습니다."}, {"no": 34, "ch": "토픽스쿨", "cat": "정치", "label": "12과. 선거와 투표", "type": "구술", "num": 1, "q": "우리반 친구들에게 무슨 일이 있는지 이야기해 보세요.", "a": "같은 반 친구들을 보니까 다들 한국어 공부를 열심히 하나 봅니다. 항상 도서관에서 공부하는 모습을 자주 봅니다. 어떤 친구는 졸린 걸 보니까 어제 밤늦게까지 공부했나 봅니다. 또 어떤 친구는 표정이 밝은 걸 보니까 좋은 일이 있나 봅니다."}, {"no": 35, "ch": "토픽스쿨", "cat": "정치", "label": "12과. 선거와 투표", "type": "구술", "num": 2, "q": "행복한 생활과 인생의 성공에 대해 이야기해 보세요.", "a": "저는 가족이야말로 행복한 생활의 필수 조건이라고 생각합니다. 가족이 건강하고 행복하면 저도 행복합니다. 인생의 성공은 큰돈을 버는 것보다 자신이 좋아하는 일을 하는 것이라고 생각합니다. 저의 성공은 한국에서 안정적으로 일하면서 가족을 한국에 초대할 수 있게 되는 것입니다."}, {"no": 36, "ch": "토픽스쿨", "cat": "정치", "label": "12과. 선거와 투표", "type": "구술", "num": 3, "q": "여러분 고향에서는 정치와 관련하여 국민이 어떤 방법으로 자신의 의사를 표현합니까?", "a": "베트남에서는 국민이 선거를 통해 자신의 의사를 표현합니다. 또 공식적인 의견서를 정부에 제출하거나 SNS를 통해서도 의견을 표현할 수 있습니다. 요즘은 인터넷이 발달해서 젊은 사람들이 SNS로 정치 의견을 많이 표현합니다."}, {"no": 37, "ch": "토픽스쿨", "cat": "정치", "label": "12과. 선거와 투표", "type": "작문", "num": 1, "q": "'함께하고 싶은 리더'라는 제목으로 100자 내외로 글을 쓰세요.", "a": "저는 직원의 의견을 잘 듣고 존중하는 리더와 함께 일하고 싶습니다. 또한 책임감이 있고 공정한 리더가 좋습니다. 그런 리더와 함께 일하면 직원들도 열심히 일하게 되고, 회사도 발전합니다. 저도 나중에 그런 리더가 되어 베트남과 한국을 연결하는 기업을 만들고 싶습니다."}, {"no": 38, "ch": "토픽스쿨", "cat": "환경", "label": "13과. 환경 보호", "type": "구술", "num": 1, "q": "여러분은 깨끗한 환경을 만들기 위해 무엇을 해요?", "a": "저는 깨끗한 환경을 만들기 위해 분리수거를 철저히 합니다. 한국은 분리수거 시스템이 잘 되어 있어서 좋습니다. 또 일회용 컵 대신 텀블러를 사용하고, 가까운 거리는 걸어다니려고 합니다. 음식물 쓰레기를 줄이려고 적당히 요리하고, 남기지 않으려고 노력합니다."}, {"no": 39, "ch": "토픽스쿨", "cat": "환경", "label": "13과. 환경 보호", "type": "구술", "num": 2, "q": "어떤 환경 문제가 있어요? 어떻게 하면 좋은지 이야기해 보세요.", "a": "요즘 미세먼지와 기후변화가 심각한 환경 문제입니다. 자동차 사용을 줄이고 대중교통을 이용하면 좋겠습니다. 또 일회용품 사용을 줄이고 친환경 제품을 사용해야 합니다. 정부와 기업, 개인 모두가 노력하지 않는 한 환경 문제는 해결되지 않을 것입니다."}, {"no": 40, "ch": "토픽스쿨", "cat": "환경", "label": "13과. 환경 보호", "type": "작문", "num": 1, "q": "'환경 보호'라는 제목으로 100자 내외로 글을 쓰세요.", "a": "환경 보호는 우리 모두의 책임입니다. 일회용품 사용을 줄이고 분리수거를 철저히 해야 합니다. 또한 에너지를 절약하고 친환경 제품을 사용하는 것이 중요합니다. 지구를 지키지 않는 한 우리의 미래도 없습니다. 저도 작은 실천부터 시작하려고 노력하고 있습니다."}, {"no": 41, "ch": "토픽스쿨", "cat": "경제", "label": "14과. 생활과 경제", "type": "구술", "num": 1, "q": "여러분은 생활 속에서 경제의 중요성을 느낀 적이 있어요?", "a": "한국에서 유학 생활을 하면서 경제의 중요성을 많이 느꼈습니다. 환율이 변하면 학비와 생활비도 변해서 항상 신경을 써야 합니다. 또 물가가 오를수록 절약해야 하는 것이 힘듭니다. 그래서 경영학을 더 열심히 공부하게 되었습니다. 졸업 후에는 한국에서 안정적으로 일하면서 경제적으로 자립하고 싶습니다."}, {"no": 42, "ch": "토픽스쿨", "cat": "경제", "label": "14과. 생활과 경제", "type": "작문", "num": 1, "q": "'물가 변화'라는 제목으로 100자 내외로 글을 쓰세요.", "a": "최근 한국의 물가가 많이 올라서 유학생들의 생활이 힘들어졌습니다. 식비와 월세가 많이 올랐고, 대중교통 요금도 인상되었습니다. 그래서 도시락을 싸고 다니고, 아르바이트도 하면서 절약하고 있습니다. 물가가 안정되어야 모든 사람이 살기 좋은 사회가 됩니다."}, {"no": 43, "ch": "토픽스쿨", "cat": "법질서", "label": "15과. 법과 질서", "type": "구술", "num": 1, "q": "여러분이 알고 있는 당연한 사실이나 진리에 대해 이야기해 보세요.", "a": "여러분도 아시다시피 한국의 여름은 정말 덥습니다. 또 여러분도 들었다시피 한국은 사계절이 뚜렷한 나라입니다. 여러분도 아시다시피 외국 생활은 많은 노력이 필요합니다. 그리고 여러분도 아시다시피 시험에 합격하려면 꾸준히 공부해야 합니다."}, {"no": 44, "ch": "토픽스쿨", "cat": "법질서", "label": "15과. 법과 질서", "type": "작문", "num": 1, "q": "'법과 질서의 필요성'이라는 제목으로 100자 내외로 글을 쓰세요.", "a": "법과 질서는 사회를 유지하는 데 꼭 필요합니다. 모든 사람이 자기 마음대로 행동한다면 사회가 혼란스러워질 것입니다. 우리 모두가 법을 지키고 질서를 지킬 때 안전하고 살기 좋은 사회가 됩니다. 외국인인 저도 한국에서 살면서 한국의 법과 질서를 잘 지키려고 노력합니다."}, {"no": 45, "ch": "토픽스쿨", "cat": "이민", "label": "16과. 이민 생활", "type": "구술", "num": 1, "q": "여러분은 한국에서 살면서 어떤 어려움을 겪었고 어떻게 극복했는지 이야기해 보세요.", "a": "저는 한국에 처음 왔을 때 한국어와 외로움이 가장 큰 어려움이었습니다. 어학당에 다니면서 한국어를 열심히 공부했고, 베트남 유학생 모임에서 친구들을 사귀었습니다. 또 한국 친구들도 많이 도와주어서 잘 적응할 수 있었습니다. 지금은 대학원에서 경영학 석사 과정을 공부하면서 한국 생활을 즐기고 있습니다."}, {"no": 46, "ch": "토픽스쿨", "cat": "이민", "label": "16과. 이민 생활", "type": "구술", "num": 2, "q": "앞으로의 한국 생활 계획에 대해 이야기해 보세요.", "a": "저는 석사 졸업 후에 한국 회사에 취직해서 일하고 싶습니다. 한국 기업의 경영 방식을 직접 배우고 싶습니다. 5년 정도 일한 후에 영주권을 신청하려고 합니다. 한국에서 안정적으로 살면서 베트남과 한국을 연결하는 일을 하고 싶습니다. 나중에는 부모님도 한국에 모시고 오고 싶습니다."}, {"no": 47, "ch": "토픽스쿨", "cat": "이민", "label": "16과. 이민 생활", "type": "작문", "num": 1, "q": "'나의 꿈'이라는 제목으로 100자 내외로 글을 쓰세요. (꿈, 노력, 현재 하는 일)", "a": "저의 꿈은 한국과 베트남을 연결하는 글로벌 비즈니스 전문가가 되는 것입니다. 그 꿈을 위해 한국에서 경영학 석사 과정을 공부하고 있습니다. 매일 한국어와 영어 공부를 하고, 다양한 분야의 책도 읽고 있습니다. 졸업 후에는 한국 기업에 취직하고 영주권을 받아 한국에서 안정적으로 살고 싶습니다."}, {"no": 48, "ch": "시대에듀", "cat": "제1회", "label": "제1회", "type": "모의고사", "num": 1, "q": "가 그림은 어떤 가족 형태입니까? 가 그림에 나오는 가족의 특징을 말해 보세요. (가: 대가족 그림)", "a": "가 그림은 대가족입니다. 대가족은 한국의 전통적인 가족 형태로, 조부모, 부모, 자녀 이렇게 3대가 함께 사는 가족을 말합니다. 여러 세대가 한집에서 함께 살기 때문에 가족 간의 유대가 깊은 편입니다. 또한 어른들을 모시고 살기 때문에 어른들이 집안의 중요한 일을 결정할 때가 많습니다."}, {"no": 49, "ch": "시대에듀", "cat": "제1회", "label": "제1회", "type": "모의고사", "num": 2, "q": "나 그림은 어떤 가족 형태입니까? 나 그림에 나오는 가족의 특징을 말해 보세요. (나: 핵가족 그림)", "a": "나 그림은 핵가족입니다. 핵가족은 부부와 미혼 자녀가 함께 사는 가족을 말합니다. 자녀가 성장하여 결혼을 하게 되면 부모님을 떠나 분가해서 부부만 살게 됩니다. 최근에 핵가족이 증가했는데, 핵가족의 경우 부부가 집안일을 분담하고 각자의 생활을 자유롭게 할 수 있다는 장점이 있습니다."}, {"no": 50, "ch": "시대에듀", "cat": "제1회", "label": "제1회", "type": "모의고사", "num": 3, "q": "ㅇㅇ씨 고향에서는 어떤 가족 형태가 많습니까? 그 이유는 무엇입니까?", "a": "제 고향인 베트남에서는 예전에는 대가족이 많았습니다. 조부모, 부모, 자녀가 함께 사는 것이 전통이었습니다. 하지만 요즘은 한국과 비슷하게 핵가족이 많이 늘어나고 있습니다. 젊은 사람들이 결혼 후에 도시로 이사 가서 부부만 살거나 자녀와 함께 살기 때문입니다. 베트남도 산업화가 진행되면서 가족 형태가 많이 바뀌고 있습니다."}, {"no": 51, "ch": "시대에듀", "cat": "제1회", "label": "제1회", "type": "모의고사", "num": 4, "q": "대기오염이 일어나는 원인은 무엇입니까? 대기오염 문제를 해결하기 위해 우리는 어떤 노력을 해야 합니까?", "a": "대기오염은 산업이 발전하면서 수많은 공장들이 생겼고, 공장에서 매연이 많이 배출되기 때문에 일어납니다. 또한 자동차 배기가스도 큰 원인입니다. 대기오염 문제를 해결하기 위해서는 자동차 사용을 줄이고 대중교통을 이용해야 합니다. 또한 친환경 에너지를 사용하고 나무를 많이 심는 것이 중요합니다. 저도 평소에 가까운 거리는 걸어다니고 분리수거를 철저히 하려고 노력하고 있습니다."}, {"no": 52, "ch": "시대에듀", "cat": "제1회", "label": "제1회", "type": "모의고사", "num": 5, "q": "우리는 생활하면서 법과 질서를 지켜야 합니다. 왜 법과 질서를 지켜야 하는지 이유를 말해 보세요.", "a": "우리는 생활하면서 법과 질서를 꼭 지켜야 합니다. 법과 질서를 지키지 않으면 주변의 많은 사람들이 불편을 느끼게 되고, 범죄의 피해자가 될까 봐 불안해할 수도 있습니다. 예를 들어 쓰레기를 함부로 버리면 거리가 지저분해지고, 교통 신호를 지키지 않으면 큰 사고가 날 수 있습니다. 모든 사람이 법과 질서를 지킬 때 안전하고 살기 좋은 사회가 됩니다."}, {"no": 53, "ch": "시대에듀", "cat": "제2회", "label": "제2회", "type": "모의고사", "num": 1, "q": "가 사진은 어디입니까? 이 문화유산에 대해 말해 보세요. (가: 불국사 사진)", "a": "가 사진은 경상북도 경주에 있는 불국사입니다. 불국사는 신라시대 때 만들어진 사찰인데, 신라시대의 불교 문화를 알 수 있는 귀중한 한국의 문화유산입니다. 유네스코 세계문화유산으로도 등재되어 있어서 많은 외국인 관광객도 방문하는 곳입니다."}, {"no": 54, "ch": "시대에듀", "cat": "제2회", "label": "제2회", "type": "모의고사", "num": 2, "q": "나 사진은 어디입니까? 이 문화유산에 대해 말해 보세요. (나: 성산일출봉 사진)", "a": "나 사진은 제주도에 있는 성산일출봉입니다. 바다 위에 솟아 있는 화산섬인데, 아름다운 일출을 볼 수 있는 곳입니다. 한국의 유명한 자연유산입니다. 제주도는 화산이 폭발해서 생긴 섬이기 때문에 독특한 화산 지형을 볼 수 있고, 유네스코 세계자연유산으로 지정되어 있습니다."}, {"no": 55, "ch": "시대에듀", "cat": "제2회", "label": "제2회", "type": "모의고사", "num": 3, "q": "ㅇㅇ씨 고향에는 어떤 문화유산이 있습니까? 그 문화유산에 대해 소개해 주세요.", "a": "제 고향인 베트남에는 하롱베이라는 유명한 문화유산이 있습니다. 하롱베이는 베트남 북부에 있는 바다인데, 약 2,000개의 작은 섬들이 모여 있는 아름다운 곳입니다. 유네스코 세계자연유산으로 등재되어 있어서 전 세계에서 많은 관광객이 방문합니다. 또 베트남에는 호이안 옛 도시도 있는데, 옛 모습을 그대로 보존하고 있어서 베트남의 역사를 느낄 수 있는 곳입니다."}, {"no": 56, "ch": "시대에듀", "cat": "제2회", "label": "제2회", "type": "모의고사", "num": 4, "q": "무슨 한국 음식을 좋아합니까? 좋아하는 한국 음식과 고향 음식을 비교해서 말해 보세요.", "a": "저는 한국 음식 중에서 비빔밥을 가장 좋아합니다. 비빔밥은 여러 가지 채소와 고기를 함께 먹을 수 있어서 영양도 좋고 맛도 있습니다. 제 고향 베트남에는 비빔밥과 비슷한 '껌땀(Cơm tấm)'이라는 음식이 있습니다. 부서진 쌀밥에 고기와 채소를 함께 먹는 음식인데, 비빔밥과 다르게 함께 비벼서 먹지는 않습니다. 두 음식 모두 한 그릇에 다양한 영양분이 들어 있어서 한 끼 식사로 좋습니다."}, {"no": 57, "ch": "시대에듀", "cat": "제2회", "label": "제2회", "type": "모의고사", "num": 5, "q": "한국에는 어떤 선거가 있습니까? 선거의 종류에 대해 말해 보세요.", "a": "한국에는 세 가지 큰 선거가 있습니다. 첫째는 대통령을 뽑는 대통령 선거로 5년마다 한 번씩 실시합니다. 둘째는 국회의원을 뽑는 국회의원 선거이고, 셋째는 지방자치단체장과 지방의회 의원을 뽑는 지방선거입니다. 국회의원 선거와 지방선거는 4년마다 실시합니다. 한국의 만 18세 이상의 국민은 누구나 투표할 권리를 가지고 있습니다."}, {"no": 58, "ch": "시대에듀", "cat": "제3회", "label": "제3회", "type": "모의고사", "num": 1, "q": "가 그림은 어디입니까? 가 그림에 나오는 농촌의 특징을 말해 보세요. (가: 농촌 그림)", "a": "가 그림은 농촌입니다. 농촌은 도시와 달리 높은 건물이나 공장도 없고 자동차도 많지 않아서 공기가 맑고 한적합니다. 또한 집 주변에 산이나 강이 있어서 경치도 아름답습니다. 농촌에 사는 사람들은 주로 직접 농사를 짓습니다. 논에서 쌀농사를 짓거나 밭에서 야채를 기르는 농부들이 많습니다."}, {"no": 59, "ch": "시대에듀", "cat": "제3회", "label": "제3회", "type": "모의고사", "num": 2, "q": "나 그림은 어디입니까? 나 그림에 나오는 도시의 특징을 말해 보세요. (나: 도시 그림)", "a": "나 그림은 도시입니다. 도시는 공공기관, 회사, 학교나 학원, 문화 시설 등이 많아서 사람들이 많이 모여서 삽니다. 또한 버스나 지하철과 같은 대중교통도 잘 발달되어 있어서 생활하기에 편리합니다. 하지만 사람과 자동차가 많아서 공기가 좋지 않고 복잡하다는 단점도 있습니다."}, {"no": 60, "ch": "시대에듀", "cat": "제3회", "label": "제3회", "type": "모의고사", "num": 3, "q": "ㅇㅇ씨는 고향에서 농촌에 살았습니까, 도시에 살았습니까? 그곳의 특징은 어떻습니까?", "a": "저는 베트남의 수도인 하노이에서 태어나고 자랐습니다. 하노이는 베트남에서 가장 큰 도시 중 하나로, 인구가 많고 교통이 복잡합니다. 한국의 서울처럼 큰 빌딩과 회사들이 많고 다양한 문화 시설도 잘 갖춰져 있습니다. 하지만 한국과 다르게 오토바이가 매우 많아서 출퇴근 시간에는 길이 매우 막힙니다. 저는 도시 생활이 편리해서 좋아합니다."}, {"no": 61, "ch": "시대에듀", "cat": "제3회", "label": "제3회", "type": "모의고사", "num": 4, "q": "물건을 구입했는데 물건에 문제가 있거나 마음에 들지 않을 때 교환이나 환불을 합니다. 교환이나 환불은 어떤 경우에 가능합니까? 또 어떤 경우에 교환이나 환불이 불가능합니까?", "a": "보통 물건을 산 지 7일 이내에 영수증을 가지고 가면 교환이나 환불이 가능합니다. 또 물건이 불량품이거나 잘못된 상품을 받았을 때도 가능합니다. 하지만 사용한 물건이나 영수증이 없을 때, 그리고 신선식품이나 화장품 같은 경우에는 환불이나 교환이 어렵습니다. 저도 한국에서 옷을 산 적이 있는데, 사이즈가 안 맞아서 영수증을 가지고 가서 교환했습니다."}, {"no": 62, "ch": "시대에듀", "cat": "제3회", "label": "제3회", "type": "모의고사", "num": 5, "q": "ㅇㅇ씨의 고향과 한국의 문화가 달라서 놀랐던 경험이 있습니까? ㅇㅇ씨가 느꼈던 문화 차이에 대해서 말해 보세요.", "a": "네, 한국에서 식사 예절이 베트남과 달라서 처음에 많이 놀랐습니다. 한국에서는 어른보다 먼저 수저를 들면 안 되고, 어른이 식사를 시작한 후에 식사를 시작해야 합니다. 또 식사할 때 그릇을 들지 않고 식탁에 놓고 먹는 것이 예의입니다. 베트남에서는 그릇을 손에 들고 먹는 것이 일반적입니다. 그리고 한국에서는 신발을 벗고 집에 들어가는데, 베트남도 비슷합니다. 시간이 지나면서 한국 문화에 많이 익숙해졌습니다."}, {"no": 63, "ch": "시대에듀", "cat": "제4회", "label": "제4회", "type": "모의고사", "num": 1, "q": "가 사진은 무엇입니까? 언제 이 음식을 먹습니까? 왜 먹습니까? 한국 사람들은 이날 무엇을 합니까? (가: 떡국 사진)", "a": "가 사진은 떡국입니다. 떡국은 한국의 설날에 먹는 음식입니다. 건강하게 오래 살기를 바라는 마음으로 설날에 떡국을 먹습니다. 한국 사람들은 설날에 떡국을 먹으면 나이도 한 살 더 먹는다고 생각합니다. 설날에는 보통 차례를 지내고 윗사람에게 세배를 합니다. 그러면 아이들은 세뱃돈을 받습니다. 또 가족들이 모여서 윷놀이, 연날리기, 제기차기 등의 전통 놀이를 합니다."}, {"no": 64, "ch": "시대에듀", "cat": "제4회", "label": "제4회", "type": "모의고사", "num": 2, "q": "나 사진은 무엇입니까? 언제 이 음식을 먹습니까? 왜 먹습니까? 한국 사람들은 이날 무엇을 합니까? (나: 송편 사진)", "a": "나 사진은 송편입니다. 송편은 한국의 추석에 먹는 음식입니다. 한 해 동안 농사가 잘된 것을 조상에게 감사하는 뜻으로 송편을 먹습니다. 송편을 예쁘게 빚으면 예쁜 아이를 낳는다는 말도 있습니다. 추석에 한국 사람들은 차례를 지내고, 조상의 산소를 찾아가서 성묘를 합니다. 또 가족들이 모여서 송편을 함께 만들고 보름달을 보며 소원을 빕니다."}, {"no": 65, "ch": "시대에듀", "cat": "제4회", "label": "제4회", "type": "모의고사", "num": 3, "q": "ㅇㅇ씨 고향에는 어떤 명절이 있습니까? 그 명절에 무엇을 먹고 무엇을 합니까?", "a": "제 고향인 베트남에는 '뗏(Tết)'이라는 가장 큰 명절이 있습니다. 뗏은 베트남의 설날로 한국의 설날과 비슷한 시기에 있습니다. 뗏에 베트남 사람들은 '반쯩(Bánh chưng)'이라는 사각형 모양의 찹쌀떡을 먹습니다. 반쯩은 찹쌀, 녹두, 돼지고기로 만든 음식인데 만드는 데 시간이 오래 걸립니다. 뗏 기간에는 가족이 모두 모여서 조상님께 제사를 지내고, 어른들에게 세뱃돈을 드립니다. 또 친척들과 친구들에게 인사를 다닙니다."}, {"no": 66, "ch": "시대에듀", "cat": "제4회", "label": "제4회", "type": "모의고사", "num": 4, "q": "ㅇㅇ씨는 한국에 살면서 어떤 어려움이 있었습니까? 어떻게 그 어려움을 극복했습니까? 한국 이민 생활에 어떻게 적응했는지 말해 보세요.", "a": "저는 한국에 처음 왔을 때 한국어와 외로움이 가장 큰 어려움이었습니다. 한국어를 잘 못해서 의사소통이 안 되어 답답했고, 가족이 그리워서 많이 외로웠습니다. 그래서 어학당에 다니면서 한국어를 열심히 공부했고, 베트남 유학생 모임에 참여해서 친구들을 많이 사귀었습니다. 한국 친구들도 많이 도와주어서 잘 적응할 수 있었습니다. 지금은 대학원에서 경영학 석사 과정을 공부하면서 한국 생활을 즐기고 있습니다."}, {"no": 67, "ch": "시대에듀", "cat": "제4회", "label": "제4회", "type": "모의고사", "num": 5, "q": "ㅇㅇ씨는 직장이나 사회에서 어떤 리더와 일하고 싶습니까? 리더에게 필요한 자질은 무엇입니까? 왜 그렇게 생각합니까?", "a": "저는 직원의 의견을 잘 듣고 존중하는 리더와 함께 일하고 싶습니다. 또한 책임감이 있고 공정한 리더가 좋습니다. 리더에게 필요한 자질은 첫째 의사소통 능력, 둘째 책임감, 셋째 공정함입니다. 그런 리더와 함께 일하면 직원들도 열심히 일하게 되고 회사 분위기도 좋아져서 회사가 발전할 수 있다고 생각합니다. 저도 졸업 후에 회사에 들어가면 좋은 리더 밑에서 일을 배우면서 나중에 그런 리더가 되고 싶습니다."}, {"no": 68, "ch": "시대에듀", "cat": "제5회", "label": "제5회", "type": "모의고사", "num": 1, "q": "가 그림은 한국의 어떤 의례입니다. 이곳에 갈 때 지켜야 할 예절에 대해 이야기해 보세요. (가: 결혼식 그림)", "a": "가 그림은 한국의 결혼식입니다. 결혼식에 갈 때는 예의를 갖추어 정장을 입는 것이 좋습니다. 결혼식이 시작하기 전에 도착해서 신랑과 신부에게 인사하고, 결혼식에 참석하여 축하를 해 줍니다. 또한 축하의 뜻으로 축의금을 내고, 신랑 신부가 하객들을 위해 마련한 피로연에 참석하여 식사를 합니다."}, {"no": 69, "ch": "시대에듀", "cat": "제5회", "label": "제5회", "type": "모의고사", "num": 2, "q": "나 그림은 한국의 어떤 의례입니다. 이곳에 갈 때 지켜야 할 예절에 대해 이야기해 보세요. (나: 장례식 그림)", "a": "나 그림은 한국의 장례식입니다. 한국의 장례식에 갈 때는 검은색 옷을 입는 것이 예의입니다. 그리고 위로의 뜻으로 조의금을 준비해야 합니다. 빈소에 들어갈 때는 헌화를 하거나 향을 피우고, 고인에게 두 번 절을 합니다. 그 후 상주에게 한 번 절을 하고 위로의 말을 전합니다. 장례식에서는 큰 소리로 웃거나 떠들면 안 되고, 조용히 행동해야 합니다."}, {"no": 70, "ch": "시대에듀", "cat": "제5회", "label": "제5회", "type": "모의고사", "num": 3, "q": "ㅇㅇ씨 고향에는 어떤 의례가 있습니까? 그 의례에서 지켜야 할 예절에 대해 말해 보세요.", "a": "제 고향인 베트남에도 결혼식과 장례식 등의 의례가 있습니다. 베트남의 결혼식은 보통 가족 행사부터 시작해서 큰 잔치까지 며칠 동안 이어집니다. 신부는 전통의상인 아오자이를 입거나 흰색 드레스를 입습니다. 결혼식에 갈 때는 예쁜 옷을 입고 축의금을 빨간 봉투에 넣어서 줍니다. 장례식에는 흰색 옷을 입고 가는데, 베트남에서는 흰색이 슬픔을 나타내는 색이기 때문입니다. 한국과는 색깔이 반대입니다."}, {"no": 71, "ch": "시대에듀", "cat": "제5회", "label": "제5회", "type": "모의고사", "num": 4, "q": "ㅇㅇ씨는 인터넷을 자주 사용합니까? 주로 인터넷으로 무엇을 합니까? 인터넷의 단점은 무엇입니까? 그런 단점을 해결하기 위해 어떻게 해야 합니까?", "a": "저는 인터넷을 매일 자주 사용합니다. 주로 학교 수업 자료를 찾아보거나 논문을 읽고, 가족과 영상통화를 합니다. 또 SNS로 친구들과 연락하고 한국 뉴스도 봅니다. 인터넷의 단점은 너무 오래 사용하면 눈도 아프고 시간을 낭비하게 된다는 점입니다. 또 잘못된 정보를 믿게 될 수도 있고, 개인정보가 유출될 위험도 있습니다. 이런 단점을 해결하기 위해서는 사용 시간을 정해 놓고 사용해야 하고, 출처가 분명한 정보만 믿어야 합니다."}, {"no": 72, "ch": "시대에듀", "cat": "제5회", "label": "제5회", "type": "모의고사", "num": 5, "q": "한국에서 지역 축제에 가본 적이 있습니까? 무슨 축제였습니까? 그 축제가 어땠습니까? ㅇㅇ씨가 가본 축제에 대해 이야기해 보세요.", "a": "네, 저는 작년 봄에 친구들과 함께 진해 군항제에 다녀왔습니다. 진해 군항제는 한국에서 유명한 벚꽃 축제입니다. 도시 전체가 벚꽃으로 가득해서 정말 아름다웠습니다. 벚꽃길을 걸으면서 사진도 많이 찍고, 다양한 한국 음식도 먹었습니다. 베트남에는 벚꽃이 없어서 처음 보는 풍경이 정말 신기했습니다. 한국 친구들과 함께 가서 한국 문화도 더 잘 이해할 수 있었고, 좋은 추억이 되었습니다."}, {"no": 73, "ch": "시대에듀", "cat": "제6회", "label": "제6회", "type": "모의고사", "num": 1, "q": "가 그림은 어떤 뜻입니까? 어디에서 이 그림을 볼 수 있습니까? (가: 금연 표시)", "a": "가 그림은 담배를 피우지 말라는 뜻입니다. 즉, 금연 표시입니다. 지하철 출입구, 버스 정류장, 공원, 학교 주변 등 공공장소에서 이 그림을 볼 수 있습니다. 한국에서는 공공장소에서 흡연하면 벌금을 내야 하기 때문에 이런 표시를 잘 보고 지켜야 합니다."}, {"no": 74, "ch": "시대에듀", "cat": "제6회", "label": "제6회", "type": "모의고사", "num": 2, "q": "나 그림은 어떤 뜻입니까? 어디에서 이 그림을 볼 수 있습니까? (나: 쓰레기 투기 금지)", "a": "나 그림은 쓰레기를 함부로 버리지 말라는 뜻입니다. 허락되지 않은 곳에 쓰레기를 버리면 안 된다는 뜻입니다. 아파트 근처나 공원, 길거리 등 쓰레기를 버리면 안 되는 곳에서 이 그림을 볼 수 있습니다. 한국은 분리수거 문화가 잘 되어 있어서 정해진 장소에 정해진 종류의 쓰레기만 버려야 합니다."}, {"no": 75, "ch": "시대에듀", "cat": "제6회", "label": "제6회", "type": "모의고사", "num": 3, "q": "ㅇㅇ씨 고향의 일상생활에서 지켜야 할 규칙이나 질서가 있습니까? 어떤 규칙이나 질서가 있습니까? 그 규칙이나 질서를 지키지 않으면 어떻게 됩니까?", "a": "제 고향인 베트남에도 일상생활에서 지켜야 할 규칙이 많이 있습니다. 예를 들어 공공장소에서 큰 소리로 떠들면 안 되고 길거리에 쓰레기를 버리면 안 됩니다. 또 오토바이를 탈 때는 반드시 헬멧을 써야 합니다. 이런 규칙을 지키지 않으면 다른 사람에게 피해를 주고, 경찰에게 벌금을 내야 할 수도 있습니다. 베트남도 한국처럼 점점 공공질서를 강조하고 있습니다."}, {"no": 76, "ch": "시대에듀", "cat": "제6회", "label": "제6회", "type": "모의고사", "num": 4, "q": "ㅇㅇ씨는 생활비를 절약하기 위해서 어떤 노력을 하고 있습니까? 생활비를 아낄 수 있는 방법에 대해 말해 보세요.", "a": "저는 유학생이라서 생활비를 절약하기 위해 여러 가지 노력을 하고 있습니다. 첫째, 외식을 줄이고 직접 요리를 해서 먹습니다. 학교에 갈 때는 도시락을 싸서 갑니다. 둘째, 대중교통을 이용하고 가까운 거리는 걸어다닙니다. 셋째, 옷이나 책은 인터넷으로 할인할 때 구입합니다. 넷째, 전기와 물을 아껴서 사용합니다. 이렇게 하면 매달 어느 정도의 돈을 절약할 수 있습니다."}, {"no": 77, "ch": "시대에듀", "cat": "제6회", "label": "제6회", "type": "모의고사", "num": 5, "q": "한국에서 복지 서비스를 이용해 본 적이 있습니까? 어떤 복지 서비스를 이용해 봤습니까? 그 서비스는 어떤 점이 좋았습니까?", "a": "네, 저는 한국에서 외국인을 위한 복지 서비스를 이용해 본 적이 있습니다. 사회통합프로그램(KIIP)에 참여해서 한국어와 한국 문화를 무료로 배우고 있습니다. 또 외국인 유학생을 위한 건강보험 제도가 있어서 병원에 갔을 때 의료비를 적게 낼 수 있었습니다. 그리고 다문화가족지원센터에서 다양한 문화 행사와 상담 서비스도 받을 수 있습니다. 이런 서비스 덕분에 한국 생활에 잘 적응할 수 있어서 정말 감사하게 생각합니다."}];
const CATS = ["전체", "⭐ 토픽스쿨 전체", "한국생활", "가족", "과학기술", "의례", "문화유산", "세계화", "건강", "정보화", "사건사고", "언어", "교육", "정치", "환경", "경제", "법질서", "이민", "⭐ 시대에듀 전체", "제1회", "제2회", "제3회", "제4회", "제5회", "제6회"];

let filtered = [...DATA];
let page = 0;
let activeCat = "전체";
let audioOn = localStorage.getItem('kiip_trang_audio') !== 'off';
const audioPlayer = document.getElementById('audioPlayer');
const audioStatus = document.getElementById('audioStatus');

function setAudioStatus(text, playing = false) {
  audioStatus.textContent = text;
  audioStatus.classList.toggle('playing', playing);
}

function playAudio(src) {
  if (!audioOn) return;
  audioPlayer.src = src;
  setAudioStatus('로딩...', true);
  audioPlayer.play().then(() => {
    setAudioStatus('재생 중', true);
  }).catch(err => {
    console.warn('Audio play failed:', err);
    setAudioStatus('재생 실패', false);
  });
}

audioPlayer.onended = () => setAudioStatus('완료', false);
audioPlayer.onerror = () => setAudioStatus('파일 없음', false);

function updateAudioToggle() {
  const btn = document.getElementById('audioToggle');
  if (audioOn) {
    btn.textContent = '🔊 음성 ON';
    btn.classList.add('on');
    btn.classList.remove('off');
  } else {
    btn.textContent = '🔇 음성 OFF';
    btn.classList.remove('on');
    btn.classList.add('off');
    audioPlayer.pause();
    setAudioStatus('음소거');
  }
}

document.getElementById('audioToggle').onclick = () => {
  audioOn = !audioOn;
  localStorage.setItem('kiip_trang_audio', audioOn ? 'on' : 'off');
  updateAudioToggle();
};

document.getElementById('replayBtn').onclick = () => {
  if (!audioOn) return;
  const card = document.getElementById('cardEl');
  const c = filtered[page];
  if (card && card.classList.contains('flipped')) {
    playAudio(`audio/a${c.no}.mp3`);
  } else {
    playAudio(`audio/q${c.no}.mp3`);
  }
};

function applyFilter(cat) {
  activeCat = cat;
  if (cat === "전체") filtered = [...DATA];
  else if (cat === "⭐ 토픽스쿨 전체") filtered = DATA.filter(d => d.ch === "토픽스쿨");
  else if (cat === "⭐ 시대에듀 전체") filtered = DATA.filter(d => d.ch === "시대에듀");
  else filtered = DATA.filter(d => d.cat === cat);
  page = 0;
  renderControls();
  render();
}

function renderControls() {
  const container = document.getElementById('controls');
  container.innerHTML = '';
  CATS.forEach(cat => {
    const btn = document.createElement('button');
    btn.textContent = cat;
    if (cat === activeCat) btn.classList.add('active');
    btn.onclick = () => applyFilter(cat);
    container.appendChild(btn);
  });
}

function render() {
  if (!filtered.length) return;
  const wrapper = document.getElementById('cardsWrapper');
  wrapper.innerHTML = '';

  const c = filtered[page];
  const chClass = c.ch === "토픽스쿨" ? "ch-topiks" : "ch-sidae";
  let typeTag = "", typeClass = "";
  if (c.type === "구술") { typeTag = "구술"; typeClass = "type-oral"; }
  else if (c.type === "작문") { typeTag = "작문"; typeClass = "type-writing"; }
  else if (c.type === "모의고사") { typeTag = `${c.num}번`; typeClass = "type-mock"; }

  const container = document.createElement('div');
  container.className = 'card-container';
  container.innerHTML = `
    <div class="card" id="cardEl">
      <div class="card-face card-front">
        <div class="card-label">질문 Q${c.no} 🎙️ Algieba</div>
        <div class="card-category">
          <span class="tag ${chClass}">${c.ch}</span>
          <span class="tag cat">${c.label}</span>
          <span class="tag ${typeClass}">${typeTag}</span>
        </div>
        <h2>${c.q}</h2>
        <div class="hint">탭 또는 Space → 답변 보기</div>
      </div>
      <div class="card-face card-back">
        <div class="card-label">모범답안 A${c.no} 🎙️ Achernar</div>
        <div class="card-category">
          <span class="tag ${chClass}">${c.ch}</span>
          <span class="tag cat">${c.label}</span>
          <span class="tag ${typeClass}">${typeTag}</span>
        </div>
        <div class="answer-label">짱(Trang)의 답변</div>
        <div class="answer">${c.a}</div>
        <div class="hint">탭 또는 Space → 질문 보기</div>
      </div>
    </div>
  `;
  container.onclick = () => {
    const card = container.querySelector('.card');
    card.classList.toggle('flipped');
    if (card.classList.contains('flipped')) {
      playAudio(`audio/a${c.no}.mp3`);
    } else {
      playAudio(`audio/q${c.no}.mp3`);
    }
  };
  wrapper.appendChild(container);

  document.getElementById('progressText').textContent = `${page + 1} / ${filtered.length}`;
  document.getElementById('progressFill').style.width = `${((page + 1) / filtered.length) * 100}%`;
  document.getElementById('stats').textContent = `${activeCat} · ${filtered.length}문항`;
  document.getElementById('prevBtn').disabled = page === 0;
  document.getElementById('nextBtn').disabled = page === filtered.length - 1;

  // 카드 변경 시 자동 재생 (질문 음성)
  if (audioOn) {
    setTimeout(() => playAudio(`audio/q${c.no}.mp3`), 100);
  }
}

function next() {
  if (page < filtered.length - 1) {
    page++;
    render();
  }
}
function prev() {
  if (page > 0) {
    page--;
    render();
  }
}
function shuffle() {
  for (let i = filtered.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
  }
  page = 0;
  render();
}

document.getElementById('prevBtn').onclick = prev;
document.getElementById('nextBtn').onclick = next;
document.getElementById('shuffleBtn').onclick = shuffle;

document.addEventListener('keydown', (e) => {
  if (e.key === ' ') {
    e.preventDefault();
    const card = document.getElementById('cardEl');
    if (card) {
      card.classList.toggle('flipped');
      const c = filtered[page];
      if (card.classList.contains('flipped')) {
        playAudio(`audio/a${c.no}.mp3`);
      } else {
        playAudio(`audio/q${c.no}.mp3`);
      }
    }
  } else if (e.key === 'ArrowLeft') prev();
  else if (e.key === 'ArrowRight') next();
  else if (e.key === 'r' || e.key === 'R') document.getElementById('replayBtn').click();
  else if (e.key === 'm' || e.key === 'M') document.getElementById('audioToggle').click();
});

let touchStartX = 0;
document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
document.addEventListener('touchend', (e) => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(diff) > 50) { diff < 0 ? next() : prev(); }
});

updateAudioToggle();
renderControls();
render();
</script>

</body>
</html>
